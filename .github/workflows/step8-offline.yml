name: Step8 offline CI
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned Python dependencies and Ansible for static checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest==9.0.2 ansible-core==2.18.10
      - name: Run regression suite and Step8 static quality gate
        run: |
          python -m pytest -q
          set +e
          python tools/step8_gate.py --output step8-gate.json
          code=$?
          set -e
          # Expected 3: live VM evidence is not available in public CI.
          # Any real failing static check returns 2 and fails this job.
          if [ "$code" -ne 3 ]; then exit 1; fi
          python -c 'import json; r=json.load(open("step8-gate.json")); assert not r["failures"]; assert r["checks"]["ansibleSyntax"]["status"]=="PASS"'
      - name: Upload redacted offline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: step8-offline-evidence
          path: step8-gate.json
          if-no-files-found: ignore
