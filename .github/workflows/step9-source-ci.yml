name: Step9 source-only quality checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: step9-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest==9.0.2 ansible-core==2.18.10
      - name: Test source and static contracts
        run: |
          python -m pytest -q
          python tools/step9_release_audit.py --output "$RUNNER_TEMP/source-audit.json"
      - name: Offline gate cannot promote release
        run: |
          set +e
          python tools/step8_gate.py --output "$RUNNER_TEMP/step8-evidence.json"
          result=$?
          set -e
          if [ "$result" -ne 3 ]; then exit 1; fi
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["result"]=="BLOCKED" and not d["releaseAuthorized"] and not d["failures"]' "$RUNNER_TEMP/step8-evidence.json"
