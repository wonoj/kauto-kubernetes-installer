name: P0 remediation offline safety and Ansible syntax
on:
  pull_request:
  push:
    branches: [main, remediation/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0-remediation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safety-and-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install explicitly pinned offline test tools
        run: |
          python -m pip install -e .
          python -m pip install pytest==9.0.2 ansible-core==2.18.10
      - name: Run Python regression and safety contracts
        run: |
          python -m pytest -q
          python tools/step9_release_audit.py --output "$RUNNER_TEMP/source-audit.json"
      - name: Syntax-check every mutating lab playbook without contacting hosts
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
          ANSIBLE_HOST_KEY_CHECKING: 'True'
        run: |
          set -eu
          for playbook in ansible/playbooks/*.yml; do
            ansible-playbook --syntax-check -i ansible/examples/lab-inventory.example.yml "$playbook"
          done
      - name: Confirm live test gate is blocked, not failed silently
        run: |
          set +e
          python tools/step8_gate.py --output "$RUNNER_TEMP/step8-gate.json"
          rc=$?
          set -e
          test "$rc" -eq 3
          python -c 'import json,sys; x=json.load(open(sys.argv[1])); assert x["checks"]["ansibleSyntax"]["status"]=="PASS"; assert x["result"]=="BLOCKED"; assert not x["releaseAuthorized"]; assert not x["failures"]' "$RUNNER_TEMP/step8-gate.json"
