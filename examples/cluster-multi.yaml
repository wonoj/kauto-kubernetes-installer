# Sample Multi-node cluster config: replace addresses and check external networks.
apiVersion: kauto.config/v1alpha1
kind: ClusterConfig
metadata:
  name: research-multi
spec:
  topology: multi-node
  kubernetes:
    version: auto
    allowEOL: false
    apiServer:
      endpoint: auto
      certSANs: []
    kubeProxy: iptables
    upstreamDNS: []
  runtime:
    type: containerd
    reuseExisting: true
    criSocket: auto
    cgroupDriver: systemd
  networking:
    ipFamily: IPv4
    podCIDR: 192.168.0.0/16
    serviceCIDR: 10.96.0.0/12
    nodeIPSelection: connectivity
    calico:
      installMethod: operator
      version: auto
      encapsulation: VXLANAlways
      dataplane: iptables
      ipamBlockSize: 26
      mtu: auto
    firewall:
      policy: approved-only
      approvedRules: []
  security:
    sshAuth: agent-or-key
    hostKeyChecking: strict
    sudo: non-interactive
  execution:
    unattended: true
    onConflict: block
    workerJoinConcurrency: 2
  backup:
    etcd:
      enabled: true
      destination: /var/lib/kauto/backups
      encryptionKeyRef: vault://etcd-snapshot-encryption
  addons:
    metricsServer: {enabled: false}
    storage: {enabled: false}
    metalLB: {enabled: false}
    gateway: {enabled: false}
    certManager: {enabled: false}
    monitoring: {enabled: false}
