[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kauto-config-core"
version = "0.9.0a1"
description = "Step 9 P0 safety remediation candidate; source-only, no supported Kubernetes installer"
requires-python = ">=3.10"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.26.0"]

[project.scripts]
kauto = "kauto.cli:main"

[tool.setuptools]
packages = ["kauto", "kauto.probes"]

[tool.setuptools.package-data]
kauto = ["schemas/*.json", "compatibility/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
